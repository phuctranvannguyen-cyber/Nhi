<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Good Morning ☀️</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="sky"></div>

    <div class="sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <div id="petals"></div>

    <div class="card">

        <div class="heart">
            💗
        </div>

        <h1 id="title">
            Good Morning
        </h1>

        <p id="message">

            Chúc bạn có một ngày thật nhiều niềm vui 🌸

        </p>

        <div id="clock">

            00:00

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
